# vibe.yaml — 오답노트. 유일한 진실. 손으로만 편집합니다.
#
# 여기 적히는 건 "좋은 습관" 이 아니라 **실제로 당한 사고**입니다.
# 격언은 AI 가 알아듣지 못합니다. 증상이 적혀 있어야 "지금이 그때" 인 걸 압니다.
#
# 규칙 넷:
#   1. symptom(증상)이 맨 앞입니다. 규칙이 아니라 상황을 먼저 적습니다.
#   2. blind(안 잡히는 것)가 빈 항목은 실을 수 없습니다. selftest 가 막습니다.
#   3. status 는 검증됨 / 제보됨 둘뿐입니다. 직접 재현해 본 것만 검증됨입니다.
#   4. AI 에게 가는 글은 **여기서 만들어냅니다.** 손으로 안 적습니다.
#      두 벌이 되면 갈라지고, 갈라지면 어느 쪽이 진짜인지 모르게 됩니다.

meta:
  title: vibe
  subtitle: 같은 실수를 두 번 하지 않게
  version: 2
  checked: 2026-08-19

surfaces:
  claude-code:
    name: Claude Code
    global: ~/.claude/CLAUDE.md
    project: CLAUDE.md
    detect: ~/.claude
  antigravity:
    name: Google Antigravity
    # GEMINI.md 가 아니라 AGENTS.md 입니다. ~/.gemini/GEMINI.md 는 Gemini CLI 가
    # 같은 경로를 하드코딩해 두어 서로 덮어씁니다 (google-gemini/gemini-cli#16058).
    global: ~/.gemini/AGENTS.md
    project: AGENTS.md
    detect: ~/.gemini

statuses:
  검증됨: "직접 다시 일으켜 봤습니다."
  제보됨: "제보받았지만 직접 재현은 못 해봤습니다(환경·비용). 검증 도장을 찍지 않습니다."

# ── 먼저 오는 것이 남에게 보이고 돈이 나가는 사고입니다.
#    혼자 만드는 사람이 제일 크게 다치는 곳이 거기입니다. ──
incidents:

  키가-소스에-박힘:
    id: E8
    name: 키와 계좌번호가 코드에 그대로 들어갔다
    symptom: API 키·비밀번호·계좌번호를 코드 파일 안에 직접 적어 넣으려 할 때
    story: >-
      API 키가 소스에 그대로 있었다. 그리고 로그인하지 않은 사람에게
      주최자 계좌번호가 통째로 보였다. 한 번 올리면 회수가 안 된다 —
      크롤러가 공개 저장소를 사람보다 먼저 본다.
    fix:
      - 키·비밀번호는 코드에 적지 않는다. 환경변수(.env)로 빼고 코드에서는 이름만 부른다.
      - 이미 올렸으면 지우는 걸로 끝내지 않는다. 그 키를 폐기하고 새로 발급한다.
      - 계좌·연락처 같은 값은 저장소가 아니라 DB에 두고, 응답에서 누구에게 보이는지 확인한다.
    blind: 아는 모양의 키만 알아본다. 처음 보는 형식이나 직접 만든 토큰은 못 알아본다.
    caught_by: check_secrets
    target: 아무 언어
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["ERRORS.md E8"] }

  env가-저장소에:
    id: E5
    name: .env 가 저장소에 딸려 들어갔다
    symptom: .gitignore 없이 새 저장소를 만들거나, .env 를 만들고 바로 커밋하려 할 때
    story: >-
      .env 가 git 에 추적되고 있었다. .gitignore 에 규칙이 없어서 파일을
      만들자마자 그대로 커밋됐다. 커밋에 남으면 파일을 지워도 히스토리에 남는다.
    fix:
      - 저장소를 만들면 .gitignore 에 .env 와 .env.* 를 **먼저** 넣는다.
      - 이미 추적 중이면 `git rm --cached .env` 로 빼낸다.
      - 이미 올렸으면 키를 새로 발급한다. 히스토리에서 지우는 것으로는 안전해지지 않는다.
    blind: .env.example 같은 템플릿은 일부러 커밋하는 파일이라 빼뒀다. 거기에 진짜 값을 적으면 안 잡힌다.
    caught_by: check_env_tracked
    target: git 쓰는 프로젝트
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["ERRORS.md E5"] }

  소스폴더-통째-공개:
    id: E7
    name: 웹서버가 소스 폴더를 통째로 열어 뒀다
    symptom: 정적 파일 서빙 경로를 프로젝트 루트나 상위 폴더로 잡으려 할 때
    story: >-
      정적 서빙이 프로젝트 루트를 가리키고 있었다. 소스·설정·백업이 그대로
      읽혔다. 공개 터널을 열고 나서야 알았다.
    fix:
      - 서빙은 public/ 같은 **전용 폴더 하나만** 가리킨다.
      - 루트나 상위 폴더(`..`)를 가리키는 코드는 쓰지 않는다.
    blind: 자바스크립트 계열 파일만 본다. 파이썬·PHP 쪽 같은 설정은 못 잡는다.
    caught_by: check_static_root
    target: 웹서버
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["ERRORS.md E7"] }

  요금-폭탄:
    id: E13
    name: 서버를 24시간 켜 두는 설정으로 무료 체험을 두 시간 만에 태웠다
    symptom: 배포 설정에서 자동 종료를 끄거나, 항상 켜 둘 최소 서버 수를 1 이상으로 두려 할 때
    story: >-
      Fly 무료 체험은 「VM 2시간 또는 7일 중 먼저 오는 것」이다.
      auto_stop_machines 를 끄고 min_machines_running 을 1로 두고 배포했다.
      03시 06분에 배포했고, 05시쯤 죽은 것을 14시간 뒤에 알았다.
    fix:
      - 자동 종료를 켜고, 항상 켜 둘 서버 수는 0 으로 둔다.
      - 콜드 스타트가 싫어서 끄는 거라면, 그 대비책을 **먼저 만들어 놓고** 끈다.
      - 무료 체험 조건은 "시간" 인지 "일" 인지 배포 전에 읽는다. 둘은 다르다.
    blind: >-
      fly.toml 만 본다. 다른 서비스의 같은 사고는 못 잡는다. 그리고 "죽은 걸
      14시간 뒤에 알았다" 는 설정이 아니라 알림이 없던 문제인데, 그건 아직 아무 검사도 없다.
    caught_by: check_fly_free_tier
    target: 배포
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["ERRORS.md E13"] }

  항상-통과하는-검사:
    id: E10
    name: 아무것도 지키지 않는 검사가 계속 통과하고 있었다
    symptom: 화면·요소 검사를 쓰거나, 새 단언을 쓰고 통과를 확인할 때
    story: >-
      화면 검사를 inner_text 로 단언했다. 숨은 요소는 빈 문자열을 돌려준다.
      "문구가 없다" 는 언제나 참이라, 화면이 멈춰 있어도 검사는 통과했다.
      통과하는 검사와 아무것도 안 보는 검사는 겉으로 구분되지 않는다.
    fix:
      - 새 단언을 쓰면, 그 단언이 지키려는 코드를 **일부러 망가뜨려 한 번 돌린다.**
        빨간 줄을 눈으로 본 다음에 되돌린다. 이 과정을 안 거친 단언은 "통과했다"고 말하지 않는다.
      - 화면 검사는 inner_text 대신 textContent 로 DOM 을 직접 읽는다.
    blind: inner_text 를 쓰는 곳만 찾는다. 다른 방식으로 똑같이 헛도는 단언은 못 잡는다.
    caught_by: check_hidden_assert
    target: 검사·테스트
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["ERRORS.md E10"] }

  # ── 아래는 번호 붙은 사고는 아니지만 같은 일이 반복돼서 규칙으로 굳힌 것들 ──

  고친게-사라짐:
    id: P1
    name: 고친 내용이 다음 실행에서 조용히 사라졌다
    symptom: 빌드·스크립트가 만들어낸 파일(생성물)을 직접 고치려 할 때
    story: >-
      생성된 파일을 직접 고쳤더니 다음 빌드에서 그대로 사라졌다.
      사라진 것을 알아채는 데 한참 걸렸다 — 고쳤다고 생각하고 있었기 때문이다.
    fix:
      - 생성된 파일은 직접 고치지 않는다. 고칠 곳은 그것을 만들어낸 소스다.
      - 새로 만드는 생성물에는 맨 위에 "이 파일은 X 에서 생성됨" 을 남긴다.
    blind: 무엇이 생성물인지 표시가 없으면 사람도 AI 도 구분할 수 없다.
    target: 아무 언어
    status: 검증됨
    evidence: { users: 1, longest: "1개월", sources: ["본인 — stackpack index.html"] }

  지운다고-말-안-함:
    id: P2
    name: 지우거나 덮어쓰는 걸 미리 말하지 않았다
    symptom: 설치·삭제·덮어쓰기·초기화처럼 되돌리기 어려운 일을 실행하려 할 때
    story: >-
      되돌리기 어려운 작업이 확인 없이 그냥 실행됐다. 기본값이 "실행" 이면
      언젠가 반드시 사고가 난다. 기본값 자체가 방어선이다.
    fix:
      - 되돌리기 어려운 일은 하기 전에 **무엇을 지우고 무엇을 덮어쓰는지 먼저 말한다.**
      - 원본을 남길 수 있으면 남긴다(.bak 등). 남길 수 없으면 그 사실을 말한다.
      - 명령을 만들 때는 미리보기를 기본값으로, 실행은 옵션으로 둔다.
    blind: 말은 했지만 사람이 안 읽고 넘기는 경우는 못 막는다.
    target: 아무 언어
    status: 검증됨
    evidence: { users: 1, longest: "1개월", sources: ["본인 — build.py install"] }

  항상-통과하는-검사기:
    id: P3
    name: 기계가 확인할 수 없는 것에 검사기를 만들어 늘 통과했다
    symptom: 외부 링크 생존·가격표·정책처럼 기계로 진위를 못 가리는 값에 검사를 붙이려 할 때
    story: >-
      만료된 결제 링크도 HTTP 200 을 돌려준다. "링크 살아있나" 검사기를 만들면
      항상 통과하는 가짜 검사가 된다. E10 과 같은 병이다.
    fix:
      - 기계로 진위를 못 가리는 값에는 검사기를 만들지 않는다.
      - 대신 **사람이 확인한 날짜**를 데이터에 적고, 그 날짜가 오래되면 빌드를 일부러 실패시킨다.
    blind: 날짜만 고치고 실제 확인은 안 하는 부정행위는 못 막는다.
    target: 아무 언어
    status: 검증됨
    evidence: { users: 1, longest: "1개월", sources: ["본인 — sell.yaml checked"] }

  문서의-숫자가-틀림:
    id: P4
    name: 문서에 적힌 개수가 실제와 어긋나 있었다
    symptom: README·문서·화면에 "도구 31개" 같은 개수나 목록을 손으로 적으려 할 때
    story: >-
      손으로 맞춘 숫자는 반드시 실제와 어긋난다. 그리고 어긋난 것을 아무도 모른다.
      보는 사람은 그 숫자를 믿는다.
    fix:
      - 문서에 적히는 개수·목록은 데이터와 대조하는 검사를 둔다. 틀리면 터지게 한다.
      - 손으로 맞추지 않는다.
    blind: 검사가 없는 문서, 그림 안의 글자, 스크린샷은 못 잡는다.
    target: 아무 언어
    status: 검증됨
    evidence: { users: 1, longest: "1개월", sources: ["본인 — build.py selftest"] }

  두-벌이-갈라짐:
    id: P5
    name: 같은 값을 두 곳에 적어 두었더니 갈라졌다
    symptom: 같은 사실(버전·경로·의존성·설명)을 두 번째 파일에 또 적으려 할 때
    story: >-
      복붙된 두 벌은 반드시 갈라진다. 갈라진 것을 알아챌 때쯤에는 어느 쪽이
      맞는지 모른다. 콤보마다 설치 명령을 손으로 복붙하다가 도구 9개가 조용히 사라진 적이 있다.
    fix:
      - 같은 사실이 두 곳에 적히면 하나를 지우고 한쪽에서 만들어낸다.
      - 지울 수 없으면 두 곳을 대조하는 검사를 둔다.
      - 파일 맨 위에 "어느 쪽이 진짜인가" 를 한 줄로 적어 둔다.
    blind: 사람 머릿속에만 있는 중복은 못 잡는다.
    target: 아무 언어
    status: 검증됨
    evidence: { users: 1, longest: "1개월", sources: ["본인 — 콤보 설치명령"] }

  내-수정과-섞임:
    id: P6
    name: 내 수정과 AI 수정이 섞여서 diff 를 못 읽었다
    symptom: 정리되지 않은 상태에서 AI 에게 코드 수정을 맡기려 할 때
    story: >-
      내가 고치던 것과 AI 가 고친 것이 한 diff 에 섞였다. 읽을 수 없으니
      결국 전부 그냥 받아들이게 됐다. 안 읽은 변경이 그대로 들어갔다.
    fix:
      - AI 에게 넘기기 전에 하던 작업을 커밋하거나 치워서 깨끗한 상태로 만든다.
      - 끝나면 변경된 것을 전부 읽는다. 읽지 않은 변경은 커밋하지 않는다.
    blind: 커밋을 안 쓰는 작업(문서·영상 편집 등)에는 그대로 적용되지 않는다.
    target: git + AI 코딩
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["본인"] }

  이어붙인-자리가-깨짐:
    id: P7
    name: 이어붙인 자리에서만 문제가 났는데 전체를 다시 봤다
    symptom: 영상·문서·데이터를 여러 조각으로 나눠 이어붙이는 작업을 할 때
    story: >-
      긴 결과물을 처음부터 끝까지 확인하느라 시간이 오래 걸렸다.
      그런데 사고는 거의 항상 **이어붙인 자리**에서 났다.
    fix:
      - 이어붙인 지점의 앞뒤만 먼저 확인한다. 전체는 그다음이다.
      - 이음매 위치를 파일로 남긴다. 다음에 같은 자리를 먼저 본다.
    blind: 이음매가 아닌 곳의 문제(중간 구간 품질 저하)는 이 방법으로 안 잡힌다.
    target: 영상·문서·데이터 병합
    status: 검증됨
    evidence: { users: 1, longest: "1주", sources: ["본인 — 0814 concat"] }

  옛-스크립트의-전제가-따라옴:
    id: P8
    name: 예전 스크립트를 재사용했더니 그때의 전제가 따라왔다
    symptom: 예전에 쓰던 일회성 스크립트를 다른 작업에 다시 쓰려 할 때
    story: >-
      예전 스크립트를 가져다 썼더니 그때의 전제(경로·해상도·포맷)가 조용히
      따라왔다. 눈에 안 보이는 전제라 한참 뒤에 드러났다.
    fix:
      - 일회성 스크립트는 그 작업 폴더 안에 두고 공용 폴더로 올리지 않는다.
      - 세 번째로 같은 걸 짜게 되면 그때 공용으로 올린다.
    blind: 두 번째까지는 매번 새로 짜는 낭비가 생긴다. 진짜 반복 작업이면 이 규칙이 틀렸다.

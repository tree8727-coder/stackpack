  조기반환이-새규칙을-건너뜀:
    id: E19
    name: 바뀐 게 데이터가 아니라 규칙이었는데, 조기 반환이 그 길을 통째로 건너뛰었다
    symptom: '"이미 처리했으면 일찍 반환" 하는 캐시·해시 비교 분기를 두거나 고칠 때'
    story: >-
      원본 파일 해시가 같으면 일찍 빠져나가게 해 뒀는데(`loadCourts()`), **그 가지에서
      뒷정리 단계를 안 불렀다.** 전날 만든 규칙 셋(중복 합치기·등급·공개정보)이 통째로
      건너뛰어졌고, **1,162곳이 전부 「등급 모름」** 인 채로 남았다. 다시 돌려도 그대로였다.
      새 데이터가 없으면 안 해도 된다고 생각했지만 바뀐 건 데이터가 아니라 **규칙**이었다.
      검사는 매번 새 DB 로 돌아서 그 가지를 한 번도 지나가지 않았고, 그래서 늘 초록불이었다.
    fix:
      - 조기 반환 가지에서도 **규칙 적용 단계는 부른다.** 여러 번 돌려도 결과가 같게 만든다.
      - 그리고 **검사가 도는 길과 운영이 도는 길이 다르면** 검사는 자기가 만든 세상만 본다.
        건너뛰기 가지를 강제로 태우고, 정말 건너뛰었는지부터 단언한다.
    blind: 같은 모양의 조기 반환이 다른 데 또 있는지는 이 규칙으로 못 찾는다.
    target: 캐시·마이그레이션
    when: ["*.db", "*.sqlite*", "migrations/*"]
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["racketon ERRORS.md E19"] }

  모르는걸-없음이라고-단언:
    id: E22
    name: 모르는 것을 화면이 "없음" 이라고 단언하고 있었다
    symptom: 값이 없을 때(null·빈 값) 화면이나 응답에 "없음"·0·false 로 그리려 할 때
    story: >-
      야간조명·주차·샤워 정보가 1,150곳 전부 비어 있었는데, 화면은 「주차 없음」 이라고
      쓰고 있었다. `x ? '' : ' 없음'` — **참이 아니면 없다**로 그렸고, null(모름)과
      0(없다)이 둘 다 거짓이라 구분이 사라졌다. DB 에는 정직하게 NULL 로 넣어 뒀는데
      화면이 그걸 도로 뭉갰다. 폼도 체크 안 한 칸을 0 으로 보내 화면 버그를 DB 로 옮기고 있었다.
    fix:
      - 상태는 셋이다 — **있음 / 없음 / 모름.** 모름을 없음으로 그리지 않는다.
      - 입력 폼은 "있는 것만 체크, 안 하면 모름" 으로 받고 null 을 보낸다.
      - 기억할 것 — **틀린 정보는 없는 정보보다 나쁘다.** 「샤워 없음」 이라고 적혀 있으면 사람은 그걸
        믿고 안 간다. 빈칸이면 전화라도 해 본다.
    blind: 모름과 없음을 애초에 구분해서 저장하지 않았다면 화면만 고쳐도 소용없다.
    target: 화면·API 응답
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["racketon ERRORS.md E22"] }

  완료표시가-기억에-붙음:
    id: E2
    name: 화면을 바꿨는데 검사를 안 고쳐서, 완료 표시가 무엇을 뜻하는지 아무도 모르게 됐다
    symptom: 문서나 할 일 목록에 완료 표시를 하거나, 화면을 바꾸고 검사를 그대로 둘 때
    story: >-
      화면만 v3 로 바꾸고 화면 기준 검사(`check-e2e.py`)를 안 고쳤다. 검사는 옛 화면의
      `#game` 라우트를 찾다 **1단계에서 죽었다.** 그런데 문서에는 완료 표시가 그대로
      여덟 개 남아 있었고, 그중 아무것도 지금 화면에서 재현되지 않았다.
      **완료 표시가 검사가 아니라 기억에 붙어 있었다.**
    fix:
      - 완료 표시는 **돌아가는 검사를 통과한 것만** 붙인다. 그 표시가 어느 검사인지 옆에 적는다.
      - 화면을 바꾸면 화면 기준 검사도 **같은 작업 안에서** 고친다.
      - 못 고치겠으면 표시를 지우지 말고 "지금 안 되는 것" 목록으로 옮긴다.
    blind: 검사가 있어도 그 검사가 헛돌면 이 규칙은 지켜진 것처럼 보인다(E10 과 같은 병).
    target: 아무 언어
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["racketon ERRORS.md E2"] }


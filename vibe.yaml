# vibe.yaml — 코딩·바이브코딩 방법론. 유일한 진실. 손으로만 편집합니다.
#
# stack.yaml 과 섞지 않습니다. 저쪽은 "설치되는 프로그램", 이쪽은 "놓이는 파일"입니다.
# 모델이 다른 둘을 한 파일에 넣으면 selftest 규율이 무너집니다.
#
# 규칙 셋:
#   1. cons(단점)가 빈 방법은 실을 수 없습니다. selftest가 막습니다.
#   2. status 는 검증됨 / 제보됨 둘뿐입니다. 직접 돌려본 것만 검증됨입니다.
#   3. evidence.users 가 실제 사람 수입니다. 부풀리는 순간 이 파일은 쓰레기가 됩니다.

meta:
  title: vibe
  subtitle: 코딩·바이브코딩 세팅을 한 번에
  version: 1
  checked: 2026-08-19

# 이 방법들이 놓이는 자리. 도구마다 읽는 파일이 다릅니다.
# 방법 쪽에는 파일 이름을 적지 않습니다 — `to: rules` 라고만 쓰고, 실제 경로는 여기서 옵니다.
# 도구가 늘면 여기만 고칩니다.
surfaces:
  claude-code:
    name: Claude Code
    global: ~/.claude/CLAUDE.md
    project: CLAUDE.md
    detect: ~/.claude          # 이 폴더가 있으면 이 도구를 쓰는 사람입니다
  antigravity:
    name: Google Antigravity
    # GEMINI.md 가 아니라 AGENTS.md 입니다. ~/.gemini/GEMINI.md 는 Gemini CLI 가
    # 같은 경로를 하드코딩해 두어 서로 덮어씁니다 (google-gemini/gemini-cli#16058).
    global: ~/.gemini/AGENTS.md
    project: AGENTS.md
    detect: ~/.gemini

# status 값의 뜻 — 페이지와 CLI가 이 문구를 그대로 씁니다.
statuses:
  검증됨: "이 저장소에서 직접 돌려봤습니다."
  제보됨: "제보받았지만 직접 못 돌려봤습니다(환경·비용). 검증 도장을 찍지 않습니다."

recipes:

  단언-부숴보기:
    name: 새로 쓴 단언은 일부러 부숴서 터지는 걸 본 다음에 믿는다
    why: 통과하는 검사와 아무것도 검사하지 않는 검사는 겉으로 구분되지 않는다.
    cons: 매번 두 번 돌려야 해서 느리다. 부수기 어려운 단언(타이밍·네트워크)에서는 생략하게 된다.
    target: 아무 언어
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["#1 본인 — 라켓온"] }
    files:
      - to: rules
        mode: append
        body: |
          ## 검사를 믿는 절차
          새 단언을 쓰면, 커밋 전에 그 단언이 **실패하는 것을 눈으로 본다.**
          기대값을 일부러 틀리게 바꿔 돌리고, 빨간 줄을 확인하고, 되돌린다.
          이 과정을 안 거친 단언은 "통과했다"고 보고하지 않는다.

  생성물-직접수정-금지:
    name: 생성된 파일은 손대지 않는다 — 소스만 고친다
    why: 생성물을 고치면 다음 빌드에서 조용히 사라진다. 사라진 걸 알아채는 데 몇 주가 걸린다.
    cons: 급할 때 결과물 한 줄 고치는 게 제일 빠른데 그걸 못 하게 막는다.
    target: 아무 언어
    status: 검증됨
    evidence: { users: 1, longest: "1개월", sources: ["#2 본인 — stackpack index.html"] }
    files:
      - to: rules
        mode: append
        body: |
          ## 생성물
          빌드·스크립트가 만들어낸 파일은 **직접 고치지 않는다.** 다음 빌드에서 조용히
          사라지기 때문이다. 고칠 곳은 그걸 생성한 소스다.
          새로 만드는 생성물에는 맨 위에 "이 파일은 X 에서 생성됨"을 남긴다.

  파괴적명령은-미리보기가-기본:
    name: 뭔가를 설치·삭제·덮어쓰는 명령은 --yes 없이는 미리보기만 한다
    why: 되돌리기 어려운 작업의 기본값이 "실행"이면 언젠가 사고가 난다. 기본값이 방어선이다.
    cons: 두 번 타이핑해야 한다. 익숙해지면 --yes를 반사적으로 붙이게 되는 부작용이 있다.
    target: CLI 만들 때
    status: 검증됨
    evidence: { users: 1, longest: "1개월", sources: ["#3 본인 — build.py install"] }
    files:
      - to: rules
        mode: append
        body: |
          ## 파괴적 명령
          설치·삭제·덮어쓰기를 하는 명령은 **미리보기가 기본값**이다.
          `--yes` 가 있을 때만 실제로 실행한다. 그리고 미리보기가 정말 아무것도
          실행하지 않는지를 검사로 못박는다(실행되면 터지는 가짜 runner를 넣는다).

  기계로-못-보는건-검사기-만들지-않기:
    name: 기계가 확인할 수 없는 것에는 검사기를 만들지 않는다 — 사람이 확인한 날짜를 적게 한다
    why: 만료된 결제 링크도 HTTP 200을 준다. "살아있나" 검사기를 만들면 항상 통과하는 가짜 검사가 된다.
    cons: 사람이 날짜를 갱신해야 한다. 날짜만 고치고 실제 확인은 안 하는 부정행위가 가능하다.
    target: 아무 언어
    status: 검증됨
    evidence: { users: 1, longest: "1개월", sources: ["#4 본인 — sell.yaml checked"] }
    files:
      - to: rules
        mode: append
        body: |
          ## 확인할 수 없는 것
          기계로 진위를 못 가리는 값(외부 링크 생존, 가격표, 정책)에는 검사기를
          만들지 않는다. 대신 **사람이 확인한 날짜**를 데이터에 적고, 그 날짜가
          오래되면 빌드를 **일부러 실패시킨다.**

  손으로-맞추는-숫자-금지:
    name: 문서의 숫자를 손으로 맞추지 않는다 — 검사가 대조하게 한다
    why: '"도구 31개" 같은 숫자는 반드시 실제와 어긋난다. 어긋난 걸 아무도 모른다.'
    cons: 검사 코드가 늘어난다. 숫자가 자주 바뀌는 초기에는 빌드가 자꾸 빨개진다.
    target: 아무 언어
    status: 검증됨
    evidence: { users: 1, longest: "1개월", sources: ["#5 본인 — build.py selftest"] }
    files:
      - to: rules
        mode: append
        body: |
          ## 문서의 숫자
          README·페이지에 적히는 개수·목록은 **데이터와 대조하는 검사**를 둔다.
          손으로 맞추지 않는다. 틀리면 터지게 한다.

  복붙-대신-파생:
    name: 같은 값을 두 곳에 적지 않는다 — 한쪽에서 파생시킨다
    why: 복붙된 두 벌은 반드시 갈라진다. 갈라진 걸 알아챌 때쯤엔 어느 쪽이 맞는지 모른다.
    cons: 파생 규칙이 한 겹 더 생겨서 처음 읽는 사람에게는 덜 직관적이다.
    target: 아무 언어
    status: 검증됨
    evidence: { users: 1, longest: "1개월", sources: ["#6 본인 — 콤보 설치명령 파생"] }
    files:
      - to: rules
        mode: append
        body: |
          ## 중복
          같은 사실이 두 곳에 적히면 하나를 지우고 파생시킨다.
          "어느 쪽이 진실인가"를 파일 맨 위에 한 줄로 적어둔다.

  변경은-작게-자주-커밋:
    name: 에이전트에게 맡기기 전에 워킹트리를 깨끗이 비운다
    why: 내 수정과 에이전트 수정이 섞이면 diff를 못 읽고, 못 읽으면 그냥 다 받아들이게 된다.
    cons: 실험 중에는 커밋할 만큼 정리가 안 된 상태가 많다. stash 를 자주 쓰게 된다.
    target: git + 코딩 에이전트
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["#7 본인"] }
    files:
      - to: rules
        mode: append
        body: |
          ## 에이전트에게 넘기기 전에
          `git status` 가 깨끗한 상태에서 시작한다. 끝나면 diff 전체를 읽는다.
          읽지 않은 diff는 커밋하지 않는다.

  터미널-안-여는-사람용-접점:
    name: 터미널을 여는 사람과 안 여는 사람에게 서로 다른 입구를 준다
    why: 인스타·카톡에서 오는 사람은 PowerShell을 안 연다. 입구가 하나면 그 사람들은 전부 이탈한다.
    cons: 입구가 둘이면 유지보수도 둘이다. 둘이 갈라지지 않게 하려면 같은 로직에서 파생시켜야 한다.
    target: 도구 배포할 때
    status: 검증됨
    evidence: { users: 1, longest: "1개월", sources: ["#8 본인 — app.py"] }
    steps:
      - "터미널 없이 열리는 정적 페이지 하나를 만든다(더블클릭 가능한 html)."
      - "그 페이지의 명령은 CLI와 **같은 함수**에서 만든다. 다시 적지 않는다."

  긴작업은-이음매를-먼저-검사:
    name: 이어붙이는 작업은 결과물 전체가 아니라 이음매만 먼저 확인한다
    why: 긴 결과물을 처음부터 끝까지 보면 시간이 오래 걸리고, 사고는 거의 항상 이음매에서 난다.
    cons: 이음매가 아닌 곳의 문제(중간 구간 품질 저하)는 이 방법으로 안 잡힌다.
    target: 영상·문서·데이터 병합
    status: 검증됨
    evidence: { users: 1, longest: "1주", sources: ["#9 본인 — 0814 concat"] }
    steps:
      - "이어붙인 지점의 앞뒤 몇 초·몇 줄만 뽑아 따로 본다."
      - "이음매 목록을 파일로 남긴다. 다음 번에 같은 곳을 먼저 본다."

  버리는-스크립트에-이름을-붙이지-않기:
    name: 한 번 쓰고 버릴 스크립트는 재사용하지 않는다 — 매번 새로 짠다
    why: 예전 스크립트를 재사용하면 그때의 전제(경로·해상도·포맷)가 조용히 따라온다.
    cons: 매번 새로 짜는 게 낭비처럼 느껴진다. 실제로 반복되는 작업이면 이 규칙이 틀렸다.
    target: 일회성 작업
    status: 검증됨
    evidence: { users: 1, longest: "2주", sources: ["#10 본인 — 0814 기존 스크립트"] }
    steps:
      - "일회성 스크립트는 작업 폴더 안에 두고, 공용 폴더로 승격시키지 않는다."
      - "세 번째로 같은 걸 짜게 되면 그때 승격시킨다."

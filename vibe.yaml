    id: E12
    name: '"30일 무료" 라는 말을 날짜로 적어 다섯 군데에 퍼뜨렸는데 하루 만에 끝났다'
    symptom: 무료 체험·할당량·만료 조건을 문서나 코드에 날짜로 적어 두려 할 때
    story: >-
      "30일 무료 체험" 이라는 말을 듣고 만료일을 날짜로 적었다. 그 날짜가 문서 넷과
      깃허브 액션 주석, 노션까지 다섯 군데로 퍼졌고 그 위에 계획이 세워졌다.
      그런데 체험은 **날짜가 아니라 크레딧 소진** 기준이었다. 한 달 남았다고 믿고
      있던 게 하루 만에 끝났다. CLI 로 남은 크레딧을 한 번도 안 봤다.
    fix:
      - 들은 말을 확인 없이 숫자로 굳히지 않는다. **공식 문서나 CLI 로 직접 확인**한다.
      - 조건이 "날짜" 인지 "사용량" 인지 먼저 가른다. 둘은 완전히 다르다.
      - 확인한 값에는 **확인한 날짜를 같이 적는다.** 그리고 한 군데에만 적고 나머지는 참조한다.
    blind: 서비스가 조건을 조용히 바꾸면 확인한 값도 틀리게 된다.

# vibe.yaml — 오답노트. 유일한 진실. 손으로만 편집합니다.
#
# 여기 적히는 건 "좋은 습관" 이 아니라 **실제로 당한 사고**입니다.
# 격언은 AI 가 알아듣지 못합니다. 증상이 적혀 있어야 "지금이 그때" 인 걸 압니다.
#
# 규칙 넷:
#   1. symptom(증상)이 맨 앞입니다. 규칙이 아니라 상황을 먼저 적습니다.
#   2. blind(안 잡히는 것)가 빈 항목은 실을 수 없습니다. selftest 가 막습니다.
#   3. status 는 검증됨 / 제보됨 둘뿐입니다. 직접 재현해 본 것만 검증됨입니다.
#   4. AI 에게 가는 글은 **여기서 만들어냅니다.** 손으로 안 적습니다.
#      두 벌이 되면 갈라지고, 갈라지면 어느 쪽이 진짜인지 모르게 됩니다.

meta:
  title: vibe
  subtitle: 같은 실수를 두 번 하지 않게
  version: 2
  checked: 2026-08-19

surfaces:
  claude-code:
    name: Claude Code
    global: ~/.claude/CLAUDE.md
    project: CLAUDE.md
    detect: ~/.claude
  antigravity:
    name: Google Antigravity
    # GEMINI.md 가 아니라 AGENTS.md 입니다. ~/.gemini/GEMINI.md 는 Gemini CLI 가
    # 같은 경로를 하드코딩해 두어 서로 덮어씁니다 (google-gemini/gemini-cli#16058).
    global: ~/.gemini/AGENTS.md
    project: AGENTS.md
    detect: ~/.gemini

statuses:
  검증됨: "직접 다시 일으켜 봤습니다."
  제보됨: "제보받았지만 직접 재현은 못 해봤습니다(환경·비용). 검증 도장을 찍지 않습니다."

# ── 먼저 오는 것이 남에게 보이고 돈이 나가는 사고입니다.
#    혼자 만드는 사람이 제일 크게 다치는 곳이 거기입니다. ──
incidents:

  키가-소스에-박힘:
    id: E8
    name: 키와 계좌번호가 코드에 그대로 들어갔다
    symptom: API 키·비밀번호·계좌번호를 코드 파일 안에 직접 적어 넣으려 할 때
    story: >-
      API 키가 소스에 그대로 있었다. 그리고 로그인하지 않은 사람에게
      주최자 계좌번호가 통째로 보였다. 한 번 올리면 회수가 안 된다 —
      크롤러가 공개 저장소를 사람보다 먼저 본다.
    fix:
      - 키·비밀번호는 코드에 적지 않는다. 환경변수(.env)로 빼고 코드에서는 이름만 부른다.
      - 이미 올렸으면 지우는 걸로 끝내지 않는다. 그 키를 폐기하고 새로 발급한다.
      - 계좌·연락처 같은 값은 저장소가 아니라 DB에 두고, 응답에서 누구에게 보이는지 확인한다.
    blind: 아는 모양의 키만 알아본다. 처음 보는 형식이나 직접 만든 토큰은 못 알아본다.
    caught_by: check_secrets
    target: 아무 언어
    when: ["*"]
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["ERRORS.md E8"] }

  env가-저장소에:
    id: E5
    name: .env 가 저장소에 딸려 들어갔다
    symptom: .gitignore 없이 새 저장소를 만들거나, .env 를 만들고 바로 커밋하려 할 때
    story: >-
      .env 가 git 에 추적되고 있었다. .gitignore 에 규칙이 없어서 파일을
      만들자마자 그대로 커밋됐다. 커밋에 남으면 파일을 지워도 히스토리에 남는다.
    fix:
      - 저장소를 만들면 .gitignore 에 .env 와 .env.* 를 **먼저** 넣는다.
      - 이미 추적 중이면 `git rm --cached .env` 로 빼낸다.
      - 이미 올렸으면 키를 새로 발급한다. 히스토리에서 지우는 것으로는 안전해지지 않는다.
    blind: .env.example 같은 템플릿은 일부러 커밋하는 파일이라 빼뒀다. 거기에 진짜 값을 적으면 안 잡힌다.
    caught_by: check_env_tracked
    target: git 쓰는 프로젝트
    when: [".git", ".env*"]
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["ERRORS.md E5"] }

  소스폴더-통째-공개:
    id: E7
    name: 웹서버가 소스 폴더를 통째로 열어 뒀다
    symptom: 정적 파일 서빙 경로를 프로젝트 루트나 상위 폴더로 잡으려 할 때
    story: >-
      정적 서빙이 프로젝트 루트를 가리키고 있었다. 소스·설정·백업이 그대로
      읽혔다. 공개 터널을 열고 나서야 알았다.
    fix:
      - 서빙은 public/ 같은 **전용 폴더 하나만** 가리킨다.
      - 루트나 상위 폴더(`..`)를 가리키는 코드는 쓰지 않는다.
    blind: 자바스크립트 계열 파일만 본다. 파이썬·PHP 쪽 같은 설정은 못 잡는다.
    caught_by: check_static_root
    target: 웹서버
    when: ["*.js", "*.ts", "*.mjs", "package.json"]
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["ERRORS.md E7"] }

  요금-폭탄:
    id: E13
    name: 서버를 24시간 켜 두는 설정으로 무료 체험을 두 시간 만에 태웠다
    symptom: 배포 설정에서 자동 종료를 끄거나, 항상 켜 둘 최소 서버 수를 1 이상으로 두려 할 때
    story: >-
      Fly 무료 체험은 「VM 2시간 또는 7일 중 먼저 오는 것」이다.
      auto_stop_machines 를 끄고 min_machines_running 을 1로 두고 배포했다.
      03시 06분에 배포했고, 05시쯤 죽은 것을 14시간 뒤에 알았다.
    fix:
      - 자동 종료를 켜고, 항상 켜 둘 서버 수는 0 으로 둔다.
      - 콜드 스타트가 싫어서 끄는 거라면, 그 대비책을 **먼저 만들어 놓고** 끈다.
      - 무료 체험 조건은 "시간" 인지 "일" 인지 배포 전에 읽는다. 둘은 다르다.
    blind: >-
      fly.toml 만 본다. 다른 서비스의 같은 사고는 못 잡는다. 그리고 "죽은 걸
      14시간 뒤에 알았다" 는 설정이 아니라 알림이 없던 문제인데, 그건 아직 아무 검사도 없다.
    caught_by: check_fly_free_tier
    target: 배포
    when: ["fly.toml", "railway.*", "render.yaml", "Procfile", "Dockerfile", "*.tf"]
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["ERRORS.md E13"] }

  항상-통과하는-검사:
    id: E10
    name: 아무것도 지키지 않는 검사가 계속 통과하고 있었다
    symptom: 화면·요소 검사를 쓰거나, 새 단언을 쓰고 통과를 확인할 때
    story: >-
      화면 검사를 inner_text 로 단언했다. 숨은 요소는 빈 문자열을 돌려준다.
      "문구가 없다" 는 언제나 참이라, 화면이 멈춰 있어도 검사는 통과했다.
      통과하는 검사와 아무것도 안 보는 검사는 겉으로 구분되지 않는다.
    fix:
      - 새 단언을 쓰면, 그 단언이 지키려는 코드를 **일부러 망가뜨려 한 번 돌린다.**
        빨간 줄을 눈으로 본 다음에 되돌린다. 이 과정을 안 거친 단언은 "통과했다"고 말하지 않는다.
      - 화면 검사는 inner_text 대신 textContent 로 DOM 을 직접 읽는다.
    blind: inner_text 를 쓰는 곳만 찾는다. 다른 방식으로 똑같이 헛도는 단언은 못 잡는다.
    caught_by: check_hidden_assert
    target: 검사·테스트
    when: ["test*", "*test*", "e2e*", "spec*", "conftest.py"]
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["ERRORS.md E10"] }

  원인을-모른채-고치기:
    id: E27
    name: 오류 메시지를 보고 바로 고치기 시작해서 같은 실수를 세 번 반복했다
    symptom: 오류가 났을 때 원인을 확인하기 전에 바로 코드를 고치려 할 때
    story: >-
      vibe.yaml 이 파싱 오류를 냈다. 따옴표를 씌워 고쳤더니 다음 줄에서 또 났고,
      또 씌웠더니 또 났다. 세 번째에야 「값이 특수문자로 시작하면 안 된다」 는
      진짜 규칙을 봤다. **매번 증상만 지우고 있었다.** 처음에 규칙을 확인했으면
      한 번에 끝났을 일을 세 번 했다.
    fix:
      - 지금 하는 게 **원인을 찾는 중인지, 고치는 중인지** 먼저 말한다. 섞으면 둘 다 못 한다.
      - 같은 오류가 두 번째 나면 **고치기를 멈추고** 왜 나는지부터 본다.
      - 고치기 전에 "이 고침이 왜 통할 거라 생각하나" 를 한 문장으로 말해 본다. 못 말하면 아직 원인을 모르는 것이다.
    blind: 원인이 외부(라이브러리·플랫폼)에 있으면 아무리 봐도 안 나온다. 그때는 최소 재현을 만들어 밖에 물어야 한다.
    target: 아무 언어
    status: 검증됨
    evidence:
      users: 1
      longest: "2일"
      sources: ["stackpack 개발 중 실측", "라켓온 지도교수 조언 2026-08-18"]

  덩어리가-너무-커짐:
    id: E26
    name: 파일 하나가 1,181줄까지 자라서, 한 곳을 고치려던 치환이 다른 곳까지 바꿨다
    symptom: 이미 큰 파일에 기능을 또 붙이거나, 문자열 치환·sed 로 소스를 고치려 할 때
    story: >-
      스택팩을 만들면서 vibe.py 가 1,181줄, 그 안의 함수 하나가 308줄까지 자랐다.
      매번 "한 군데만 더 붙이면 된다" 고 판단했다. 열한 번째 수정에서
      `import subprocess` 를 치환했더니 **함수 안쪽에 들여쓰기된 같은 글자까지 같이
      바뀌어** 파일이 깨졌다. 앞선 수정에서는 `if True:` 같은 패치 자국도 남았다.
      AI 는 파일을 구조가 아니라 **글자**로 고친다. 커질수록 같은 글자가 여러 번 나온다.
    fix:
      - 파일이 800줄, 함수가 200줄을 넘으면 **기능을 더 붙이기 전에 쪼갠다.** 옮기기만 해도 다음 수정이 쉬워진다.
      - 처음부터 **부분별로 나눠서** 짠다. 이름이 안 떠오르는 덩어리가 있으면 아직 정리가 안 된 것이다.
      - AI 에게 시키기 전에 **구조와 운영 정책을 사람이 먼저 정한다.** 그걸 안 정하고 시작하면 나중에 나눌 수 없다.
      - 치환으로 고칠 때는 **그 글자가 파일에 몇 번 나오는지 먼저 센다.** 한 번이 아니면 치환하지 않는다.
      - 고친 뒤 문법 검사를 돌린다. 치환은 조용히 깨뜨린다.
    blind: >-
      줄 수는 «고치기 어려움» 의 대리 지표일 뿐이다. 짧아도 얽힌 코드는 그대로 어렵고,
      길어도 순서대로만 읽으면 되는 코드는 안 어렵다. 이 검사는 그 차이를 모른다.
    caught_by: check_too_big
    target: 아무 언어
    when: ["*"]
    status: 검증됨
    evidence: { users: 1, longest: "2일", sources: ["stackpack 개발 중 실측"] }

  # ── 아래 8건은 라켓온 ERRORS.md 원본에서 옮겨 왔습니다.
  #    남의 프로젝트에도 그대로 나는 사고만 골랐습니다. ──

  빈결과가-좋은데이터를-덮음:
    id: E3
    name: 수집이 0건으로 끝났는데 그 0건이 지난 데이터를 덮어썼다
    symptom: 외부에서 받아온 결과를 파일이나 DB에 그대로 덮어쓰려 할 때
    story: >-
      인증키가 없으면 결과가 0건이 된다. 그 0건을 건수와 무관하게 그대로 덮어썼고,
      데이터 파일이 2바이트(`[]`)가 됐다. 더 나쁜 건 화면이 멀쩡해 보였다는 것이다 —
      비면 예시 데이터로 폴백하게 해 뒀기 때문이다. 진짜 데이터가 한 번도 들어온 적이
      없다는 사실이 예시에 가려져 있었다. 언제부터 비었는지는 지금도 모른다.
    fix:
      - 덮어쓰기 전에 **건수와 유효율을 먼저 본다.** 기준 미달이면 지난 것을 그대로 둔다.
      - 폴백(예시·기본값)을 넣을 거면 **폴백이 켜졌다는 사실을 화면이나 로그에 드러낸다.**
        조용한 폴백은 사고를 가린다.
      - 결과 파일을 .gitignore 에 넣었으면 이력이 없다는 뜻이다. 언제 망가졌는지 못 찾는다.
    blind: 0건이 아니라 "절반만 들어온" 경우는 건수만 봐서는 안 잡힌다.
    target: 데이터 수집·동기화
    when: ["*.json", "*.csv", "*.db", "*.sqlite*"]
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["racketon ERRORS.md E3"] }

  한줄에-신뢰경계가-둘:
    id: E6
    name: 같은 줄에서 이름은 서버 값을, 실력은 사용자가 보낸 값을 썼다
    symptom: 요청 본문(body)에서 온 값과 세션·DB에서 온 값을 한 줄에 같이 쓸 때
    story: >-
      닉네임은 세션에서 가져오도록 고치면서 실력 점수는 클라이언트가 보낸 값을 그대로
      받았다. `{ nick: u.nick, ntrp: b.ntrp ?? u.ntrp }` — **한 줄 안에 신뢰 경계가
      두 개 있었다.** 실력 2.0인 사용자가 body 에 4.5를 실어 보내 상위 모집 판에 들어갔다.
      "누구인가"만 신원이라고 본 게 실수였다. 자격·등급도 신원의 일부다.
    fix:
      - 사용자가 보낸 값과 서버가 아는 값을 **한 줄에 섞지 않는다.** 줄을 나눠 어느 쪽에서
        왔는지 눈에 보이게 한다.
      - 권한·등급·가격처럼 **속으면 이득이 되는 값**은 무조건 서버에서 다시 읽는다.
      - 한 곳을 고칠 때 **같은 패턴이 있는 나머지 진입점도 같이 본다.** 셋 중 하나만 고쳤었다.
    blind: 서버가 값을 잘못 갖고 있으면 이 규칙으로는 못 막는다.
    target: 서버·API
    when: ["*.js", "*.ts", "*.py", "package.json"]
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["racketon ERRORS.md E6"] }

  성공을-먼저-찍음:
    id: E9
    name: 저장하기 전에 성공이라고 찍어서, 안 들어간 코드를 들어간 줄 알고 배포했다
    symptom: 여러 번 고친 뒤 마지막에 한 번 저장하거나, 단계마다 성공 표시를 찍는 코드를 쓸 때
    story: >-
      파일을 여러 군데 고치는 헬퍼가 **메모리에서만 바꾸고 「성공」을 찍었다.**
      저장은 맨 마지막 한 번뿐이었다. 첫 호출은 성공 표시가 찍혔고, 다음 호출이 인자를
      빠뜨려 죽었다. 그래서 저장이 아예 안 됐는데 화면에는 성공만 남았다.
      안 들어간 코드를 들어간 줄 알고 배포했고, 운영에 예시 자리 6개가 그대로 올라갔다.
    fix:
      - 성공은 **저장이 끝난 뒤에** 찍는다. 저장 전에 찍는 성공은 거짓말이다.
      - 여러 군데를 고칠 때는 **하나 고칠 때마다 저장**하거나, 실패하면 전체를 되돌린다.
      - 고친 뒤에는 **파일을 다시 읽어** 그 내용이 실제로 들어갔는지 확인한다.
    blind: 저장은 됐는데 내용이 틀린 경우는 못 잡는다. 그건 읽어서 확인해야 안다.
    target: 아무 언어
    when: ["*"]
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["racketon ERRORS.md E9"] }


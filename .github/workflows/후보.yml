# 되돌림이 몰린 자리를 «후보» 로 저장소에 자동으로 적습니다.
#
# **카탈로그는 절대 안 건드립니다.** 후보는 사고가 아닙니다 —
# (파일명을 여기 적지 않습니다 — 검사가 그 글자를 찾기 때문입니다)
# 되돌림은 «어디» 만 알려주고 «무엇» 은 모릅니다. 사람이 채워야 사고가 됩니다.
# 자동으로 사고 문장을 지으면 «지어내지 않는다» 가 무너지고, 그게 이 저장소의
# 유일한 자산입니다.
name: 후보 갱신

on:
  schedule: [{ cron: "41 3 * * *" }]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    name: 후보 갱신
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 집계에서 후보 뽑기
        id: 뽑기
        run: |
          test -f 집계.json || { echo "집계 없음"; exit 0; }
          python3 - <<'PY'
          import json, os, pathlib
          집계 = json.load(open("집계.json", encoding="utf-8"))
          기준 = 5      # 이만큼 넘게 몰려야 «자리» 로 봅니다. 한둘은 잡음입니다.
          후보 = {k[2:]: v for k, v in 집계.items()
                if k.startswith("R:") and isinstance(v, int) and v >= 기준}
          옛것 = pathlib.Path("후보.md")
          있던 = 옛것.read_text(encoding="utf-8") if 옛것.exists() else ""
          줄 = ["# 아직 이름 없는 사고 — 후보", "",
              "**이것은 카탈로그가 아닙니다.** 되돌림이 몰린 «자리» 일 뿐입니다.",
              "되돌림은 어디인지만 알려주고 무엇인지는 모릅니다 —",
              "겪은 사람이 써야 사고가 됩니다.", "",
              f"설치 {집계.get('설치수', 0)}대 기준. 자동으로 갱신됩니다.", "",
              "| 어디 | 되돌린 횟수 | 사람이 채울 것 |", "|---|---|---|"]
          for 확장자, n in sorted(후보.items(), key=lambda x: -x[1]):
              줄.append(f"| `{확장자}` 파일 | {n}번 | 무슨 일이 있었나 · 언제 나나 · 그래서 뭘 다르게 하나 |")
          if not 후보:
              줄.append("| (아직 없음) | | |")
          새것 = "\n".join(줄) + "\n"
          옛것.write_text(새것, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"바뀜={'yes' if 새것 != 있던 else 'no'}\n")
              f.write(f"개수={len(후보)}\n")
          PY
      - name: 커밋
        if: steps.뽑기.outputs.바뀜 == 'yes'
        run: |
          git config user.name "후보"
          git config user.email "noreply@github.com"
          git add 후보.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: 후보 갱신 (${{ steps.뽑기.outputs.개수 }}자리)"
          git push

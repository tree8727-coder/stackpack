name: 내가 당한 사고 제보
description: 이런 일을 겪었다 — 남이 같은 일을 안 겪게
title: "[사고] "
labels: ["사용법-제출", "제보됨"]
body:
  - type: markdown
    attributes:
      value: |
        인스타 DM·카톡·모임에서 들은 이야기도 **여기로 다시 내주세요.**
        창구는 여럿이지만 **입구는 여기 하나**입니다. 여기 아닌 곳으로 온 것은
        저장소에 올리지 않습니다 (공개할 권리를 확보할 수 없어서입니다).

  - type: input
    id: 한줄
    attributes:
      label: 무슨 일이 있었나요 (한 줄)
      placeholder: "예) 배포했더니 무료 체험이 두 시간 만에 다 타버렸다"
    validations:
      required: true

  - type: input
    id: 증상
    attributes:
      label: 언제 이 사고가 나나요
      description: "「~하려 할 때」 로 적어주세요. AI 는 규칙이 아니라 상황을 알아봅니다."
      placeholder: "예) 배포 설정에서 자동 종료를 끄려 할 때"
    validations:
      required: true

  - type: textarea
    id: 절차
    attributes:
      label: 실제로 있었던 일
      description: 무엇을 보고 알았는지. 날짜·숫자가 기억나면 그대로 적어주세요.
    validations:
      required: true

  - type: textarea
    id: 그래서
    attributes:
      label: 그래서 다음부터 뭘 다르게 하나요
    validations:
      required: true

  - type: input
    id: 환경
    attributes:
      label: 어디서 쓰나요
      placeholder: "예) Claude Code / Windows 11 / Python"
    validations:
      required: true

  - type: input
    id: 기간
    attributes:
      label: 얼마나 써봤나요
      description: 표본을 밝히기 위해 필요합니다. "한 번 해봄"도 그대로 적어주세요.
      placeholder: "예) 2주째 매일"
    validations:
      required: true

  - type: textarea
    id: 안좋은점
    attributes:
      label: 이렇게 해도 안 잡히는 경우
      description: 없으면 "모르겠음". **이 칸이 빈 제보는 채택하지 않습니다.**
    validations:
      required: true

  - type: input
    id: 표기이름
    attributes:
      label: 표기할 이름
      description: 채택되면 이 이름으로 출처를 남깁니다. 익명을 원하면 "익명".
    validations:
      required: true

  - type: checkboxes
    id: 동의
    attributes:
      label: 공개 동의
      options:
        - label: 이 내용이 MIT 라이선스로 공개 저장소에 실리는 것에 동의합니다.
          required: true
        - label: 회사 기밀·API 키·개인정보가 들어 있지 않은지 확인했습니다.
          required: true

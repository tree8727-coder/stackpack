# 이 파일을 sell.yaml 로 복사하고 값을 채우면 buy.html 이 만들어집니다.
#
#   cp sell.example.yaml sell.yaml     (윈도우: copy sell.example.yaml sell.yaml)
#   uv run app.py
#
# sell.yaml 은 .gitignore 에 있습니다. 개인 송금 링크가 저장소에 올라가면 안 됩니다.
# 값이 하나라도 비면 buy.html 을 만들지 않습니다 — 반쯤 만들어진 결제 페이지가
# 배포되는 게 제일 나쁩니다.

# 카카오페이 송금 링크. 사업자 없이 개인이 만들 수 있고, 금액을 미리 박아둘 수 있습니다.
# 카카오톡 > 페이 > 송금 > 링크로 받기 에서 만들고, 금액을 price 와 같게 맞추세요.
kakaopay: "https://qr.kakaopay.com/여기에_본인_링크"

# 카카오페이를 안 쓰는 사람을 위한 대체 수단. 은행 / 계좌번호 / 예금주.
account: "○○은행 000-0000-0000 (예금주)"

# 입금하고 연락할 곳. 오픈채팅 링크를 권합니다 (전화번호 노출 없음).
kakao_openchat: "https://open.kakao.com/o/여기에_본인_방"

# 페이지에 표시할 파는 사람 이름. 실명이 아니어도 되지만 연락은 닿아야 합니다.
seller: "달나루"

# 원 단위 정수. kakaopay 링크에 박아둔 금액과 같아야 합니다.
price: 9900

# 송금 링크를 마지막으로 **직접 열어 본** 날 (YYYY-MM-DD).
#
# 링크가 살아 있는지는 기계로 확인할 수 없습니다. 만료돼도 같은 페이지에
# HTTP 200 이 옵니다. 그래서 사람이 확인한 날짜를 적게 하고,
# 14일이 지나면 buy.html 을 만들지 않습니다.
#
# 확인하는 법: 로그아웃 상태나 다른 기기에서 링크를 열어
#   ① 카카오페이로 넘어가는지 ② 금액이 price 와 같게 뜨는지
# 「사용할 수 없는 송금코드입니다」가 뜨면 새로 만들고 kakaopay 를 고치세요.
checked: 2026-08-17

# vibe.yaml — 오답노트. 유일한 진실. 손으로만 편집합니다.
#
# 여기 적히는 건 "좋은 습관" 이 아니라 **실제로 당한 사고**입니다.
# 격언은 AI 가 알아듣지 못합니다. 증상이 적혀 있어야 "지금이 그때" 인 걸 압니다.
#
# 규칙 넷:
#   1. symptom(증상)이 맨 앞입니다. 규칙이 아니라 상황을 먼저 적습니다.
#   2. blind(안 잡히는 것)가 빈 항목은 실을 수 없습니다. selftest 가 막습니다.
#   3. status 는 검증됨 / 제보됨 둘뿐입니다. 직접 재현해 본 것만 검증됨입니다.
#   4. AI 에게 가는 글은 **여기서 만들어냅니다.** 손으로 안 적습니다.
#      두 벌이 되면 갈라지고, 갈라지면 어느 쪽이 진짜인지 모르게 됩니다.

meta:
  title: vibe
  subtitle: 같은 실수를 두 번 하지 않게
  version: 2
  checked: 2026-08-19

surfaces:
  claude-code:
    name: Claude Code
    global: ~/.claude/CLAUDE.md
    project: CLAUDE.md
    detect: ~/.claude
  antigravity:
    name: Google Antigravity
    # GEMINI.md 가 아니라 AGENTS.md 입니다. ~/.gemini/GEMINI.md 는 Gemini CLI 가
    # 같은 경로를 하드코딩해 두어 서로 덮어씁니다 (google-gemini/gemini-cli#16058).
    global: ~/.gemini/AGENTS.md
    project: AGENTS.md
    detect: ~/.gemini

statuses:
  검증됨: "직접 다시 일으켜 봤습니다."
  제보됨: "제보받았지만 직접 재현은 못 해봤습니다(환경·비용). 검증 도장을 찍지 않습니다."

# ── 먼저 오는 것이 남에게 보이고 돈이 나가는 사고입니다.
#    혼자 만드는 사람이 제일 크게 다치는 곳이 거기입니다. ──
incidents:

  키가-소스에-박힘:
    id: E8
    name: 키와 계좌번호가 코드에 그대로 들어갔다
    symptom: API 키·비밀번호·계좌번호를 코드 파일 안에 직접 적어 넣으려 할 때
    story: >-
      API 키가 소스에 그대로 있었다. 그리고 로그인하지 않은 사람에게
      주최자 계좌번호가 통째로 보였다. 한 번 올리면 회수가 안 된다 —
      크롤러가 공개 저장소를 사람보다 먼저 본다.
    fix:
      - 키·비밀번호는 코드에 적지 않는다. 환경변수(.env)로 빼고 코드에서는 이름만 부른다.
      - 이미 올렸으면 지우는 걸로 끝내지 않는다. 그 키를 폐기하고 새로 발급한다.
      - 계좌·연락처 같은 값은 저장소가 아니라 DB에 두고, 응답에서 누구에게 보이는지 확인한다.
    blind: 아는 모양의 키만 알아본다. 처음 보는 형식이나 직접 만든 토큰은 못 알아본다.
    caught_by: check_secrets
    target: 아무 언어
    when: ["*"]
    severity: 높음
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["ERRORS.md E8"] }

  env가-저장소에:
    id: E5
    name: .env 가 저장소에 딸려 들어갔다
    symptom: .gitignore 없이 새 저장소를 만들거나, .env 를 만들고 바로 커밋하려 할 때
    story: >-
      .env 가 git 에 추적되고 있었다. .gitignore 에 규칙이 없어서 파일을
      만들자마자 그대로 커밋됐다. 커밋에 남으면 파일을 지워도 히스토리에 남는다.
    fix:
      - 저장소를 만들면 .gitignore 에 .env 와 .env.* 를 **먼저** 넣는다.
      - 이미 추적 중이면 `git rm --cached .env` 로 빼낸다.
      - 이미 올렸으면 키를 새로 발급한다. 히스토리에서 지우는 것으로는 안전해지지 않는다.
    blind: .env.example 같은 템플릿은 일부러 커밋하는 파일이라 빼뒀다. 거기에 진짜 값을 적으면 안 잡힌다.
    caught_by: check_env_tracked
    target: git 쓰는 프로젝트
    when: [".git", ".env*"]
    severity: 높음
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["ERRORS.md E5"] }

  소스폴더-통째-공개:
    id: E7
    name: 웹서버가 소스 폴더를 통째로 열어 뒀다
    symptom: 정적 파일 서빙 경로를 프로젝트 루트나 상위 폴더로 잡으려 할 때
    story: >-
      정적 서빙이 프로젝트 루트를 가리키고 있었다. 소스·설정·백업이 그대로
      읽혔다. 공개 터널을 열고 나서야 알았다.
    fix:
      - 서빙은 public/ 같은 **전용 폴더 하나만** 가리킨다.
      - 루트나 상위 폴더(`..`)를 가리키는 코드는 쓰지 않는다.
    blind: 자바스크립트 계열 파일만 본다. 파이썬·PHP 쪽 같은 설정은 못 잡는다.
    caught_by: check_static_root
    target: 웹서버
    when: ["*.js", "*.ts", "*.mjs", "package.json"]
    severity: 높음
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["ERRORS.md E7"] }

  요금-폭탄:
    id: E13
    name: 서버를 24시간 켜 두는 설정으로 무료 체험을 두 시간 만에 태웠다
    symptom: 배포 설정에서 자동 종료를 끄거나, 항상 켜 둘 최소 서버 수를 1 이상으로 두려 할 때
    story: >-
      Fly 무료 체험은 「VM 2시간 또는 7일 중 먼저 오는 것」이다.
      auto_stop_machines 를 끄고 min_machines_running 을 1로 두고 배포했다.
      03시 06분에 배포했고, 05시쯤 죽은 것을 14시간 뒤에 알았다.
    fix:
      - 자동 종료를 켜고, 항상 켜 둘 서버 수는 0 으로 둔다.
      - 콜드 스타트가 싫어서 끄는 거라면, 그 대비책을 **먼저 만들어 놓고** 끈다.
      - 무료 체험 조건은 "시간" 인지 "일" 인지 배포 전에 읽는다. 둘은 다르다.
    blind: >-
      fly.toml 만 본다. 다른 서비스의 같은 사고는 못 잡는다. 그리고 "죽은 걸
      14시간 뒤에 알았다" 는 설정이 아니라 알림이 없던 문제인데, 그건 아직 아무 검사도 없다.
    caught_by: check_fly_free_tier
    target: 배포
    when: ["fly.toml", "railway.*", "render.yaml", "Procfile", "Dockerfile", "*.tf"]
    severity: 높음
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["ERRORS.md E13"] }

  항상-통과하는-검사:
    id: E10
    name: 아무것도 지키지 않는 검사가 계속 통과하고 있었다
    symptom: 화면·요소 검사를 쓰거나, 새 단언을 쓰고 통과를 확인할 때
    story: >-
      화면 검사를 inner_text 로 단언했다. 숨은 요소는 빈 문자열을 돌려준다.
      "문구가 없다" 는 언제나 참이라, 화면이 멈춰 있어도 검사는 통과했다.
      통과하는 검사와 아무것도 안 보는 검사는 겉으로 구분되지 않는다.
    fix:
      - 새 단언을 쓰면, 그 단언이 지키려는 코드를 **일부러 망가뜨려 한 번 돌린다.**
        빨간 줄을 눈으로 본 다음에 되돌린다. 이 과정을 안 거친 단언은 "통과했다"고 말하지 않는다.
      - 화면 검사는 inner_text 대신 textContent 로 DOM 을 직접 읽는다.
    blind: inner_text 를 쓰는 곳만 찾는다. 다른 방식으로 똑같이 헛도는 단언은 못 잡는다.
    caught_by: check_hidden_assert
    target: 검사·테스트
    when: ["test*", "*test*", "e2e*", "spec*", "conftest.py"]
    초록불: true          # 무언가가 «괜찮다» 고 알려준 뒤에 배신했다
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["#1 본인", "ERRORS.md E10"] }

  셸편집이-쓰기신호에서-빠짐:
    id: E36
    name: 신호 수집이 셸 편집을 통째로 놓쳤는데, 옆 신호가 쌓여서 살아 있는 줄 알았다
    symptom: 훅·감사 로그가 «도구 이름» 으로 걸려 있고, AI 가 셸(`python3 - <<EOF`, `sed -i`, `> 파일`)로 파일을 고칠 때
    story: >-
      쓰기 기록이 `Write` / `Edit` / `NotebookEdit` 에만 붙어 있었다. AI 가 셸
      히어독으로 파일을 고치자 **아무것도 안 남았다.** 2026-08-26 하루에 작업
      폴더의 `.py` **19개를 고쳤는데 기록은 0건**이었고, 마지막 기록은 **8/22**
      였다 — 나흘이 통째로 비었다.
      그런데 같은 폴더의 `막은기록.jsonl` 은 그날도 계속 쌓이고 있었다. 옆 신호가
      살아 있으니 **수집 전체가 도는 것처럼 보였다.**
      되돌림 감지는 쓰기 기록을 뒤져서 판단하므로 **같이 죽었다** — 되돌림 파일도
      8/22 에서 멈춰 있었다. 한 신호가 다른 신호를 조용히 데려갔다.
    fix:
      - 훅이 보는 **도구 목록**과 실제로 파일이 바뀌는 **경로**가 같은지 대조한다. 도구 이름으로 거는 순간 셸은 빠진다.
      - 신호 파일마다 «마지막 기록 시각» 을 재고, **다른 신호는 쌓이는데 하나만 멈춰 있으면** 알린다.
      - 파생 신호(되돌림처럼 다른 기록에 의존하는 것)는 **원본이 죽으면 같이 죽는다.** 따로 살아있음을 재야 한다.
      - 확인법 — 하루 작업한 뒤 각 기록 파일의 마지막 시각이 오늘인지 본다. 하나라도 며칠 전이면 그 신호는 끊긴 것이다.
    blind: 셸에서 파일을 쓰는 방법은 끝이 없다(python · awk · tee · 리다이렉션 · 에디터). 목록으로 잡으면 새 방법은 계속 빠진다.
    when: ["*.json", "*.py", "*.sh", "settings.json"]
    초록불: true          # 옆 신호가 쌓여서 «수집이 돌고 있다» 로 보였다
    target: 훅 · 감사 로그
    status: 검증됨
    evidence:
      users: 1
      longest: "4일"
      sources: ["stackpack 자기 점검 2026-08-26 실측 — 19개 수정 / 0건 기록"]

  이름으로-캐시한-중간산출물:
    id: E37
    name: 이름으로 저장해 둔 중간 산출물이 다른 것을 가리켰는데, 없으면 조용히 옛것으로 돌아갔다
    symptom: 중간 결과를 `씬03.mp4` 처럼 **번호나 이름으로 저장해 두고** 다음 단계가 갖다 쓸 때
    story: >-
      한 영상 프로젝트에서 같은 병이 **네 번** 났다. 구성을 바꾸면 `m04` 같은 씬
      번호가 **다른 클립**을 가리키는데 —
      (1) 마스킹이 지난 빌드의 원본 캐시 `_raw.mp4` 를 재사용해 **엉뚱한 클립에
      모자이크를 걸었고**(71프레임짜리 자리에 52프레임 클립),
      (2) 세로판 렌더가 자막 `main_v.ass` 를 **만들지 않고 읽기만** 해서 두 판이
      **예전 자막을 달고 나갔고**,
      (3) 포스터를 안 구운 엔드 씬을 `P26_v.mp4` 로 만들어 뒀는데 번호가 25 로
      밀리자 `if 있으면 쓴다` 가 **조용히 구운 판본으로 되돌아가** 포스터가
      **두 겹**으로 나갔고,
      (4) 썸네일 후보 목록에 손으로 적어 둔 번호가 나중에 «얼굴 가려 달라» 는
      요청 대상이 됐다.
      **네 번 모두 검사는 통과했다.** 파일은 있었고 형식도 맞았다. 내용만 다른
      것이었다. 셋은 눈으로 프레임을 보고서야 잡혔다.
    fix:
      - 미리 만들어 두고 갖다 쓰지 않는다 — **쓰는 쪽이 그 자리에서 만든다.** 그러면 낡을 수가 없다.
      - 있으면 쓰고 없으면 넘어가는 **조용한 되돌아감을 지운다.** 못 만들면 멈춘다.
      - 굳이 캐시하면 이름이 아니라 **내용으로 키를 잡는다**(프레임 수 · 해시). 안 맞으면 버리고 다시 만든다.
      - 캐시를 지우는 시점을 **다시 만드는 시점에 묶는다.** «나중에 정리» 는 안 온다.
      - 사람·대상 목록을 두 곳에 적지 않는다. 원본 한 곳에서 걸러 낸다.
    blind: 내용 키가 우연히 같으면(길이가 같은 다른 클립) 그대로 지나간다. 프레임 수만으로는 부족하다.
    when: ["*.mp4", "*.mov", "*.ass", "*.srt", "*.py", "*.sh"]
    초록불: true          # 유출 검사 · 싱크 검사 · 립싱크 검사가 전부 통과했다
    target: 영상 편집
    status: 검증됨
    evidence:
      users: 1
      longest: "두 판 (v16 · v17)"
      sources: ["SWYFT 신촌 인터뷰 편집 2026-08-26 실측 — 한 프로젝트에서 4회"]

  파이프가-실패를-가림:
    id: E35
    name: 검사가 실패했는데 파이프가 종료 코드를 가려서 그대로 밀었다
    symptom: 명령 뒤에 파이프(`| tail`, `| grep`, `| head`)를 붙여 결과만 보려 할 때
    story: >-
      `검사 | tail -1` 로 마지막 줄만 보고 다음 단계로 넘어갔다. 파이프는
      **마지막 명령의 종료 코드**를 돌려준다 — `tail` 은 항상 성공한다.
      그래서 검사가 실패했는데도 `&&` 로 이어진 커밋과 푸시가 그대로 실행됐고,
      **검사가 깨진 판이 올라갔다.** 화면에는 `AssertionError` 가 찍혀 있었는데
      기계는 «성공» 으로 읽었다.
      같은 날 배포 관문을 시험할 때도 `sh build.sh | tail -2` 로 재서
      «막혔는데 종료 0» 으로 보였다.
    fix:
      - 통과 여부를 볼 때는 **파이프를 붙이지 않는다.** 출력이 길면 파일로 받아서 따로 본다.
      - 굳이 붙여야 하면 `set -o pipefail` 을 켜거나 `${PIPESTATUS[0]}` 을 본다.
      - 사람이 화면에서 «빨간 글씨» 를 봤다고 기계도 그렇게 읽는 건 아니다.
    blind: 종료 코드는 0 인데 실제로는 실패한 명령(오류를 삼키는 스크립트)은 이걸로 못 잡는다.
    when: ["*.sh", "*.yml", "*.yaml", "Makefile"]
    초록불: true          # 화면에는 실패가 찍혔는데 기계는 성공으로 읽었다
    target: 셸 · CI
    status: 검증됨
    evidence:
      users: 1
      longest: "당일"
      sources: ["stackpack 워커 관문 작업 중 실측 2026-08-22"]

  손으로_시험하면_멀쩡해_보인다:
    id: E34
    name: curl 로는 200 이 오는데 프로그램에서는 403·인코딩 오류가 났다
    symptom: 새로 만든 통신 경로를 curl 이나 브라우저로만 확인하고 넘어갈 때
    story: >-
      집계 서버를 띄우고 `curl` 로 시험했더니 200 이 왔다. 그런데 프로그램에서
      부르니 **세 번 연속으로 다른 이유로 실패**했다. ① 주소에 한글이 있어
      파이썬이 못 보냈다(UnicodeEncodeError) ② 인증서 대비를 한 함수에만 해
      뒀는데 보내는 쪽은 다른 함수였다 ③ 파이썬 기본 이름(`Python-urllib`)을
      Cloudflare 가 봇으로 보고 **403** 을 돌려줬다.
      **셋 다 curl 로는 200 이 나온다.** 손으로 시험한 것은 프로그램을 시험한
      것이 아니다.
    fix:
      - 통신 경로는 **프로그램이 실제로 부르는 방식 그대로** 시험한다. curl 로 확인하고 넘어가지 않는다.
      - 인터넷으로 나가는 «문» 을 하나로 모은다. 두 벌이면 한쪽만 고쳐진다(P5).
      - 그 문에서 우리 이름(User-Agent)을 밝힌다. 기본 이름은 봇으로 보고 막는 곳이 많다.
      - 주소에 한글·공백이 있으면 인코딩한다. curl 은 알아서 해 주고 파이썬은 안 해 준다.
    blind: >-
      쓰는 사람 쪽 네트워크(사내 프록시·방화벽)에서 막히는 것은 여기서 못 잡는다.
      그리고 200 이 왔다고 내용이 맞는 것도 아니다.
    when: ["*.py", "*.js", "*.ts", "*.sh"]
    초록불: true          # curl 이 200 을 줘서 «된다» 고 믿었다
    target: 통신 · API
    status: 검증됨
    evidence:
      users: 1
      longest: "당일"
      sources: ["stackpack 집계 서버 연결 2026-08-22"]

  자동화가-조용히-안-돌았다:

    id: E22
    name: 모르는 것을 화면이 "없음" 이라고 단언하고 있었다
    symptom: 값이 없을 때(null·빈 값) 화면이나 응답에 "없음"·0·false 로 그리려 할 때
    story: >-
      야간조명·주차·샤워 정보가 1,150곳 전부 비어 있었는데, 화면은 「주차 없음」 이라고
      쓰고 있었다. `x ? '' : ' 없음'` — **참이 아니면 없다**로 그렸고, null(모름)과
      0(없다)이 둘 다 거짓이라 구분이 사라졌다. DB 에는 정직하게 NULL 로 넣어 뒀는데
      화면이 그걸 도로 뭉갰다. 폼도 체크 안 한 칸을 0 으로 보내 화면 버그를 DB 로 옮기고 있었다.
    fix:
      - 상태는 셋이다 — **있음 / 없음 / 모름.** 모름을 없음으로 그리지 않는다.
      - 입력 폼은 "있는 것만 체크, 안 하면 모름" 으로 받고 null 을 보낸다.
      - 기억할 것 — **틀린 정보는 없는 정보보다 나쁘다.** 「샤워 없음」 이라고 적혀 있으면 사람은 그걸
        믿고 안 간다. 빈칸이면 전화라도 해 본다.
    blind: 모름과 없음을 애초에 구분해서 저장하지 않았다면 화면만 고쳐도 소용없다.

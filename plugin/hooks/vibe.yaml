  항상-통과하는-검사기:
    id: P3
    name: 기계가 확인할 수 없는 것에 검사기를 만들어 늘 통과했다
    symptom: 외부 링크 생존·가격표·정책처럼 기계로 진위를 못 가리는 값에 검사를 붙이려 할 때
    story: >-
      만료된 결제 링크도 HTTP 200 을 돌려준다. "링크 살아있나" 검사기를 만들면
      항상 통과하는 가짜 검사가 된다. E10 과 같은 병이다.
    fix:
      - 기계로 진위를 못 가리는 값에는 검사기를 만들지 않는다.
      - 대신 **사람이 확인한 날짜**를 데이터에 적고, 그 날짜가 오래되면 빌드를 일부러 실패시킨다.
    blind: 날짜만 고치고 실제 확인은 안 하는 부정행위는 못 막는다.
    target: 아무 언어
    초록불: true          # 무언가가 «괜찮다» 고 알려준 뒤에 배신했다
    status: 검증됨
    evidence: { users: 1, longest: "1개월", sources: ["#4 본인", "본인 — sell.yaml checked"] }

  문서의-숫자가-틀림:
    id: P4
    name: 문서에 적힌 개수가 실제와 어긋나 있었다
    symptom: README·문서·화면에 "도구 31개" 같은 개수나 목록을 손으로 적으려 할 때
    story: >-
      README 에 「도구 31개」 라고 손으로 적어 뒀는데 `stack.yaml` 의 실제 개수와
      어긋났다. 어긋난 것을 아무도 몰랐다. 보는 사람은 그 숫자를 믿는다.
      스택팩을 만들면서도 같은 일을 또 했다 — 사고 건수를 13건이라 적어 둔 채
      실제로는 21건이 됐다.
    fix:
      - 문서에 적히는 개수·목록은 데이터와 대조하는 검사를 둔다. 틀리면 터지게 한다.
      - 손으로 맞추지 않는다.
    blind: 검사가 없는 문서, 그림 안의 글자, 스크린샷은 못 잡는다.
    target: 아무 언어
    초록불: true          # 무언가가 «괜찮다» 고 알려준 뒤에 배신했다
    status: 검증됨
    evidence: { users: 1, longest: "1개월", sources: ["#5 본인", "본인 — build.py selftest"] }

  두-벌이-갈라짐:
    id: P5
    name: 같은 값을 두 곳에 적어 두었더니 갈라졌다
    symptom: 같은 사실(버전·경로·의존성·설명)을 두 번째 파일에 또 적으려 할 때
    story: >-
      복붙된 두 벌은 반드시 갈라진다. 갈라진 것을 알아챌 때쯤에는 어느 쪽이
      맞는지 모른다. 콤보마다 설치 명령을 손으로 복붙하다가 도구 9개가 조용히 사라진 적이 있다.
    fix:
      - 같은 사실이 두 곳에 적히면 하나를 지우고 한쪽에서 만들어낸다.
      - 지울 수 없으면 두 곳을 대조하는 검사를 둔다.
      - 파일 맨 위에 "어느 쪽이 진짜인가" 를 한 줄로 적어 둔다.
    blind: 사람 머릿속에만 있는 중복은 못 잡는다.
    target: 아무 언어
    status: 검증됨
    evidence: { users: 1, longest: "1개월", sources: ["#6 본인", "본인 — 콤보 설치명령"] }

  내-수정과-섞임:
    id: P6
    name: 내 수정과 AI 수정이 섞여서 diff 를 못 읽었다
    symptom: 정리되지 않은 상태에서 AI 에게 코드 수정을 맡기려 할 때
    story: >-
      내가 고치던 것과 AI 가 고친 것이 한 diff 에 섞였다. 읽을 수 없으니
      결국 전부 그냥 받아들이게 됐다. 안 읽은 변경이 그대로 들어갔다.
    fix:
      - AI 에게 넘기기 전에 하던 작업을 커밋하거나 치워서 깨끗한 상태로 만든다.
      - 끝나면 변경된 것을 전부 읽는다. 읽지 않은 변경은 커밋하지 않는다.
    blind: 커밋을 안 쓰는 작업(문서·영상 편집 등)에는 그대로 적용되지 않는다.
    target: git + AI 코딩
    status: 검증됨
    evidence: { users: 1, longest: "3개월", sources: ["#7 본인", "본인"] }

  이어붙인-자리가-깨짐:
    id: P7
    name: 이어붙인 자리에서만 문제가 났는데 전체를 다시 봤다
    symptom: 영상·문서·데이터를 여러 조각으로 나눠 이어붙이는 작업을 할 때
    story: >-
      영상 24개 구간을 이어붙였는데, 사고는 거의 항상 **이음매**에서 났다.
      `-ss` 를 `-i` 앞에만 써서 영상만 늦게 시작했고, 그 차이가 이음매마다 쌓여
      **누적 96프레임(3.2초)** 까지 벌어졌다. 전체를 처음부터 끝까지 보느라
      시간은 시간대로 쓰고 정작 이음매는 놓쳤다.
    fix:
      - 이어붙인 지점의 앞뒤만 먼저 확인한다. 전체는 그다음이다.
      - 이음매 위치를 파일로 남긴다. 다음에 같은 자리를 먼저 본다.
    blind: 이음매가 아닌 곳의 문제(중간 구간 품질 저하)는 이 방법으로 안 잡힌다.
    target: 영상·문서·데이터 병합
    status: 검증됨
    evidence: { users: 1, longest: "1주", sources: ["#9 본인", "본인 — 0814 concat"] }

  옛-스크립트의-전제가-따라옴:
    id: P8
    name: 예전 스크립트를 재사용했더니 그때의 전제가 따라왔다
    symptom: 예전에 쓰던 일회성 스크립트를 다른 작업에 다시 쓰려 할 때
    story: >-
      예전 파이프라인(`perfect_pipeline.sh`)을 가져다 썼더니 그때의 전제가 조용히
      따라왔다 — 내용과 무관하게 **15분·1시간·1시간45분 지점을 3분씩 기계적으로**
      잘라내는 스크립트였다. 눈에 안 보이는 전제라, 결과물 자막이 깨진 뒤에야 드러났다.
    fix:
      - 일회성 스크립트는 그 작업 폴더 안에 두고 공용 폴더로 올리지 않는다.
      - 세 번째로 같은 걸 짜게 되면 그때 공용으로 올린다.
    blind: 두 번째까지는 매번 새로 짜는 낭비가 생긴다. 진짜 반복 작업이면 이 규칙이 틀렸다.
    target: 일회성 작업
    status: 검증됨
    evidence: { users: 1, longest: "2주", sources: ["#10 본인", "본인 — 0814 기존 스크립트"] }

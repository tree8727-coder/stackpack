    symptom: 깃허브 액션·CI 설정에서 작업(job) 이름이나 키에 한글·공백·특수문자를 쓸 때
    story: >-
      배포 워크플로의 작업 이름을 `검사:` `배포:` 로 지었다. 깃허브 액션의 작업
      ID 는 영문·숫자만 된다. 워크플로가 **0초 만에 실패**했고, 실행 목록에는
      이름 대신 파일 경로가 찍혔으며 **로그도 남지 않았다.**
      며칠 동안 배포가 한 번도 안 돌았는데 아무 알림도 없었다.
      태그를 붙여 보고 나서야 알았다.
    fix:
      - 작업 ID 는 영문·숫자·밑줄만 쓴다. 한글로 보여주고 싶으면 `name:` 을 따로 붙인다.
      - CI 를 붙이면 **일부러 실패시켜 빨간불이 실제로 오는지** 한 번 본다. 안 오면 그건 안 붙은 것이다.
      - 실행 목록에 **작업 이름 대신 파일 경로**가 찍히면 설정을 못 읽은 것이다.
    blind: >-
      이 검사는 작업 ID 만 본다. 워크플로가 도는데 안에서 잘못하는 것은 못 잡는다.
      그리고 «실패 알림이 안 온다» 는 문제 자체는 그대로 남는다.
    when: ["*.yml", "*.yaml"]

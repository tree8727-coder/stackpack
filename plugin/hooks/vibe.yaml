  받은-파일이-깨져-있었다:
    id: E32
    name: 받아온 파일이 86바이트짜리 오류 페이지였는데 그대로 썼다
    symptom: 인터넷에서 받은 파일(음원·이미지·데이터)을 확인 없이 파이프라인에 넣을 때

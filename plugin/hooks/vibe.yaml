      - 길이도 본다. 효과음이 2시간이면 그건 효과음이 아니다.
    blind: 형식이 맞고 길이도 그럴듯한 «틀린 파일» 은 못 잡는다. 그건 들어 봐야 안다.
    when: ["*.mp3", "*.ogg", "*.wav", "*.mp4", "*.png", "*.jpg"]
    target: 미디어·데이터 수집

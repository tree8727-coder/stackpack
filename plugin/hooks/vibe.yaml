  시크위치로-영상만-밀림:
    id: E29
    name: -ss 를 -i 앞에만 써서 영상만 밀렸고, 컷 경계에서 참가자 얼굴이 샜다
    symptom: ffmpeg 로 구간을 잘라 이어붙일 때, 특히 -ss 를 -i 앞에 두고 자를 때
    story: >-
      `-ss` 를 `-i` **앞에만** 쓰면 키프레임 단위로 건너뛰어 영상만 늦게 시작한다.
      요청 24.10초에 영상이 23.87초로 나왔고, concat 데먹서가 그 차이를 프레임
      복제로 메우면서 영상만 뒤로 밀렸다. 이음매마다 쌓여 **누적 96프레임(3.2초)**
      까지 벌어졌다. 그 결과 모자이크 정책이 실제 화면과 어긋나
      **컷 경계에서 참가자 얼굴이 샜다.** 진행자가 참가자들에게 «얼굴은 모두
      모자이크한다» 고 세 번 약속한 뒤였다.
    fix:
      - 2단계 시크를 쓴다 — `-ss (t-4) -i SRC` 로 빠르게 건너뛴 뒤 `trim=start=4` / `atrim=start=4` 로 정확히 자른다.
      - 길이를 프레임 경계로 양자화하고 `-frames:v N` 으로 프레임 수를 못박는다.
      - 타임라인을 컨테이너 Duration 이 아니라 **실제 프레임 수 누적**으로 계산한다.
      - 확인법 — 이어붙인 결과의 fps 가 **정확히 30.00** 이면 이음매가 없다. 밀리면 29.84 처럼 나온다.
    blind: 영상·오디오 시크 지점이 다른 컷어웨이는 입력별로 따로 trim 해야 하고, 이 검사는 그것까지 못 본다.
    caught_by: check_ffmpeg_seek
    when: ["*.mp4", "*.mov", "*.mkv", "*.srt", "*.sh", "ffmpeg*"]
    target: 영상 편집
    status: 검증됨
    evidence:
      users: 1
      longest: "2주"
      sources: ["0814 편집 파이프라인 v2→v3 실측"]

  라우드놈-뒤-리샘플-누락:
    id: E30
    name: loudnorm 뒤에 aresample 을 안 붙여 오디오가 96kHz 로 나갔다
    symptom: ffmpeg 로 loudnorm(음량 정규화)을 걸 때
    story: >-
      `loudnorm` 필터는 내부적으로 표본율을 192kHz 로 올린다. 뒤에
      `aresample=48000` 을 안 붙이면 최종 파일이 **96kHz 로 나간다.**
      플레이어에서는 멀쩡히 들려서 배포 직전까지 몰랐다.
    fix:
      - loudnorm 뒤에는 항상 `aresample=48000` 을 붙인다.
      - 내보낸 뒤 `ffprobe` 로 표본율을 확인한다. 귀로는 안 들린다.
    blind: 의도적으로 96kHz 로 내보내는 경우는 구분하지 못한다. 그때는 이 규칙이 틀렸다.
    caught_by: check_loudnorm
    when: ["*.mp4", "*.mov", "*.wav", "*.sh", "ffmpeg*"]
    target: 영상 편집
    초록불: true          # 무언가가 «괜찮다» 고 알려준 뒤에 배신했다
    status: 검증됨
    evidence: { users: 1, longest: "2주", sources: ["0814 편집 파이프라인 실측"] }

  임시폴더에-작업물을-둠:
    id: E31
    name: 임시 폴더가 정리되면서 스크립트 14개와 3시간짜리 전사가 통째로 사라졌다
    symptom: 오래 걸린 작업 결과(전사·중간 산출물·스크립트)를 임시 폴더에 두려 할 때
    story: >-
      스크래치패드에 두고 작업하다 폴더가 정리됐다. 스크립트 14개 · 3시간 오디오
      전사 · 동기화 데이터 · 카드 그래픽 · 폰트가 한 번에 사라졌다.
      살아남아 복구를 가능하게 한 것은 **밖으로 내보낸 문서 두 개**뿐이었다.
      그리고 다시 전사하면 결과가 달라진다 — 오인식 양상이 바뀌어
      («동사»→«공사») 손으로 쌓은 교정 사전 50여 개가 대부분 안 맞았다.
    fix:
      - 다시 만들기 어려운 것(전사·라벨·수작업 교정)은 **만들자마자 임시 폴더 밖으로** 내보낸다.
      - 무엇이 «다시 만들기 어려운가» 를 작업 시작할 때 한 줄로 적어 둔다.
      - 결정론적이지 않은 산출물(전사·생성)은 **결과를 원본으로 삼는다.** 다시 돌리면 달라진다.
    blind: 얼마나 자주 내보내야 하는지는 이 규칙이 안 정해 준다. 한 시간짜리 작업과 사흘짜리 작업이 다르다.
    when: ["*.mp4", "*.srt", "*.json", "*.sh", "*.py"]
    target: 오래 걸리는 작업
    status: 검증됨

name: 허브 페이지 빌드 & 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 별점 갱신
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # stack.yaml 참조 무결성 검사 — 깨진 데이터는 배포하지 않습니다
      - run: uv run build.py selftest

      - run: uv run build.py stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: uv run build.py html

      - run: mkdir -p _site && cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
